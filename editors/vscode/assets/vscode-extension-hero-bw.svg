      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#DDDDDD" />
      <stop offset="100%" stop-color="#999999" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="vsWhiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="vsGrid" width="32" height="32" patternUnits="userSpaceOnUse">
