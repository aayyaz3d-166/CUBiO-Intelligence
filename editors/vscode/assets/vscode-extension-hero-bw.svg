<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Monochrome Background Gradients -->
    <linearGradient id="vsDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0c0c0c" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="vsCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181818" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0.98" />
    </linearGradient>

    <!-- Platinum Header Gradient -->
