<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLTO Sovereign Notepad — Portable Desktop App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0e17;
      --panel-dark: rgba(20, 27, 45, 0.75);
      --card-dark: rgba(26, 36, 60, 0.65);
      --border-dark: rgba(255, 255, 255, 0.08);
      --text-dark: #f8fafc;
      --text-muted-dark: #94a3b8;

      --bg-light: #f1f5f9;
      --panel-light: rgba(255, 255, 255, 0.85);
      --card-light: rgba(248, 250, 252, 0.95);
      --border-light: rgba(0, 0, 0, 0.08);
      --text-light: #0f172a;
      --text-muted-light: #64748b;

      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.25);
      --emerald-dark: #059669;
      --orange: #f97316;
      --orange-glow: rgba(249, 115, 22, 0.25);
      --red: #ef4444;

      --blur: blur(25px);
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 6px;
    }

    body.dark {
      --bg: var(--bg-dark);
      --panel: var(--panel-dark);
      --card: var(--card-dark);
      --border: var(--border-dark);
      --text: var(--text-dark);
      --text-muted: var(--text-muted-dark);
      --editor-bg: rgba(14, 20, 34, 0.7);
    }

    body.light {
      --bg: var(--bg-light);
      --panel: var(--panel-light);
      --card: var(--card-light);
      --border: var(--border-light);
      --text: var(--text-light);
      --text-muted: var(--text-muted-light);
      --editor-bg: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Top App Titlebar / Action Bar */
    header.app-bar {
      height: 56px;
      background: var(--panel);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background: linear-gradient(135deg, var(--emerald), var(--orange));
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 0 15px var(--emerald-glow);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.3px;
    }

    .brand-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--card);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-primary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-success {
      background: var(--emerald);
      color: #fff;
      box-shadow: 0 2px 10px var(--emerald-glow);
    }

    .btn-success:hover {
      background: var(--emerald-dark);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .btn-danger:hover {
      background: var(--red);
      color: #fff;
    }

    .btn-theme {
      background: var(--card);
      border-color: var(--border);
      color: var(--text);
      padding: 7px 10px;
    }

    /* Main Window Layout */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar - Saved Notes */
    aside.sidebar {
      width: 260px;
      background: var(--panel);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px 18px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .note-item {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .note-item:hover {
      background: var(--card);
      border-color: var(--border);
    }

    .note-item.active {
      background: var(--card);
      border-color: var(--emerald);
      box-shadow: 0 0 15px var(--emerald-glow);
    }

    .note-item-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Editor Workspace */
    main.editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 32px;
      overflow: hidden;
      gap: 16px;
    }

    .title-input-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
      user-select: text;
    }

    .title-input::placeholder {
      color: var(--text-muted);
      opacity: 0.5;
    }

    .editor-wrapper {
      flex: 1;
      position: relative;
      background: var(--editor-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-textarea {
      flex: 1;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: 'JetBrains Mono', 'Plus Jakarta Sans', monospace;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--text);
      user-select: text;
    }

    .editor-textarea::placeholder {
      color: var(--text-muted);
      opacity: 0.4;
    }

    /* Bottom Status Bar */
    footer.status-bar {
      height: 32px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .status-left, .status-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    /* Modal / Alert Notification Toast */
    .toast {
      position: fixed;
      bottom: 44px;
      right: 24px;
      background: var(--card);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--emerald);
      color: var(--text);
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 15px var(--emerald-glow);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="dark">

  <!-- Top App Navigation / Action Bar -->
  <header class="app-bar">
    <div class="brand-group">
      <div class="brand-icon">O</div>
      <div class="brand-title">OLTO Notepad</div>
      <span class="brand-tag">Sovereign GUI</span>
    </div>

    <div class="actions-group">
      <button id="btn-new" class="btn btn-primary" title="Create a new note">
        📄 New Note
      </button>
      <button id="btn-save-disk" class="btn btn-success" title="Save to local disk as .txt file">
        💾 Save (.txt)
      </button>
      <button id="btn-clear" class="btn btn-danger" title="Clear current note">
        🗑️ Clear
      </button>
      <button id="btn-theme" class="btn btn-theme" title="Toggle Theme (Dark / Light)">
        🌙 / ☀️
      </button>
    </div>
  </header>

  <!-- App Body Layout -->
  <div class="app-body">
    <!-- Sidebar: Notes History -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>Saved Notes</span>
        <span id="saved-count-badge">0</span>
      </div>
      <div class="notes-list" id="notes-list">
        <!-- Rendered reactively via Signal -->
      </div>
    </aside>

    <!-- Editor Pane -->
    <main class="editor-pane">
      <div class="title-input-container">
        <input type="text" id="note-title-input" class="title-input" placeholder="Note Title...">
      </div>
      <div class="editor-wrapper">
        <textarea id="note-editor" class="editor-textarea" placeholder="Start typing your thoughts, code, or ideas here..."></textarea>
      </div>
    </main>
  </div>

  <!-- Bottom Telemetry & Status Bar -->
  <footer class="status-bar">
    <div class="status-left">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="status-badge-dot"></span>
        <span id="engine-status">OLTO Reactive Engine: Active</span>
      </div>
      <span>•</span>
      <span id="save-status">Auto-Saved</span>
    </div>
    <div class="status-right">
      <span id="counter-words">Words: 0</span>
      <span>•</span>
      <span id="counter-chars">Characters: 0</span>
      <span>•</span>
      <span>UTF-8</span>
    </div>
  </footer>

  <!-- Notification Toast -->
  <div id="toast" class="toast">
    <span>✔</span> <span id="toast-msg">Note Saved</span>
  </div>

  <script>
    // =========================================================================
    // OLTO FRONTEND REACTIVE RUNTIME (FINE-GRAINED SIGNALS ENGINE)
    // =========================================================================

    function createSignal(initialVal) {
      let value = initialVal;
      const subscribers = new Set();
      const read = () => {
        return value;
      };
      const write = (newVal) => {
        if (value !== newVal) {
          value = newVal;
          subscribers.forEach(fn => fn(value));
        }
      };
      const subscribe = (fn) => {
        subscribers.add(fn);
        fn(value);
      };
      return [read, write, subscribe];
    }

    // 1. Reactive State Signals
    const [title, setTitle, subTitle] = createSignal("Welcome to OLTO Notepad");
    const [content, setContent, subContent] = createSignal(
      "✦ OLTO Sovereign Desktop Notepad\n" +
      "================================\n\n" +
      "This is a standalone, portable desktop GUI application.\n\n" +
      "Features:\n" +
      "1. Fine-grained reactive state without external libraries.\n" +
      "2. Live word & character telemetry.\n" +
      "3. 100% offline local storage persistence.\n" +
      "4. Direct export to .txt format.\n" +
      "5. Zero setup, zero installation wizard."
    );
    const [activeNoteId, setActiveNoteId, subActiveId] = createSignal(null);
    const [theme, setTheme, subTheme] = createSignal("dark");

    // 2. DOM Elements
    const titleInput = document.getElementById('note-title-input');
    const editor = document.getElementById('note-editor');
    const notesList = document.getElementById('notes-list');
    const wordCounter = document.getElementById('counter-words');
    const charCounter = document.getElementById('counter-chars');
    const saveStatus = document.getElementById('save-status');
    const countBadge = document.getElementById('saved-count-badge');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');

    // 3. Persistent Vault Storage (Zero External Dependencies)
    let notesVault = JSON.parse(localStorage.getItem('olto_notepad_vault')) || [
      {
        id: 1,
        title: "Welcome to OLTO Notepad",
        content: editor.value || content(),
        updatedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      }
    ];

    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function saveVault() {
      localStorage.setItem('olto_notepad_vault', JSON.stringify(notesVault));
      countBadge.textContent = notesVault.length;
    }

    function updateTelemetry(text) {
      const trimmed = text.trim();
      const words = trimmed ? trimmed.split(/\s+/).length : 0;
      const chars = text.length;
      wordCounter.textContent = `Words: ${words}`;
      charCounter.textContent = `Characters: ${chars}`;
    }

    function renderNotesList() {
      notesList.innerHTML = '';
      notesVault.forEach(n => {
        const item = document.createElement('div');
        item.className = `note-item ${n.id === activeNoteId() ? 'active' : ''}`;
        item.innerHTML = `
          <div class="note-item-title">${escapeHTML(n.title || 'Untitled')}</div>
          <div class="note-item-meta">${n.updatedAt}</div>
        `;
        item.onclick = () => {
          setActiveNoteId(n.id);
          setTitle(n.title);
          setContent(n.content);
          titleInput.value = n.title;
          editor.value = n.content;
          updateTelemetry(n.content);
          renderNotesList();
          showToast("Note Loaded");
        };
        notesList.appendChild(item);
      });
      countBadge.textContent = notesVault.length;
    }

    function escapeHTML(str) {
      return (str || '').replace(/[&<>'"]/g,
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Auto-save logic
    let autoSaveTimer = null;
    function triggerAutoSave() {
      saveStatus.textContent = "Saving...";
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        const currentTitle = titleInput.value.trim() || "Untitled Note";
        const currentText = editor.value;
        const currentId = activeNoteId();

        let target = notesVault.find(n => n.id === currentId);
        if (target) {
          target.title = currentTitle;
          target.content = currentText;
          target.updatedAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } else {
          const newId = Date.now();
          setActiveNoteId(newId);
          notesVault.unshift({
            id: newId,
            title: currentTitle,
            content: currentText,
            updatedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
        }
        saveVault();
        renderNotesList();
        saveStatus.textContent = "Auto-Saved";
      }, 500);
    }

    // Event Bindings
    titleInput.addEventListener('input', (e) => {
      setTitle(e.target.value);
      triggerAutoSave();
    });

    editor.addEventListener('input', (e) => {
      setContent(e.target.value);
      updateTelemetry(e.target.value);
      triggerAutoSave();
    });

    // Button Actions
    document.getElementById('btn-new').onclick = () => {
      const newId = Date.now();
      const freshTitle = "Untitled Note";
      const freshContent = "";
      setActiveNoteId(newId);
      setTitle(freshTitle);
      setContent(freshContent);
      titleInput.value = freshTitle;
      editor.value = freshContent;
      updateTelemetry(freshContent);
      triggerAutoSave();
      titleInput.focus();
      showToast("Fresh Note Created");
    };

    document.getElementById('btn-clear').onclick = () => {
      if (confirm("Clear current note content?")) {
        editor.value = "";
        setContent("");
        updateTelemetry("");
        triggerAutoSave();
        showToast("Editor Cleared");
      }
    };

    document.getElementById('btn-save-disk').onclick = () => {
      const fileName = (titleInput.value.trim() || "note") + ".txt";
      const blob = new Blob([editor.value], { type: "text/plain;charset=utf-8" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast(`Exported to ${fileName}`);
    };

    document.getElementById('btn-theme').onclick = () => {
      const nextTheme = theme() === 'dark' ? 'light' : 'dark';
      setTheme(nextTheme);
      document.body.className = nextTheme;
    };

    // Initialize State
    titleInput.value = title();
    editor.value = content();
    updateTelemetry(content());
    setActiveNoteId(notesVault[0]?.id || 1);
    renderNotesList();
  </script>
</body>
</html>
