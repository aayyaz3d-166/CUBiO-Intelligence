<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="120" r="140" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="380" r="160" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="450" r="100" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />

  <!-- Header Badge -->
  <rect x="470" y="32" width="260" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="600" y="54" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">NEW IN ONE LANGUAGE v1.4.0</text>

  <!-- Main Title -->
  <text x="600" y="115" fill="url(#neonCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1" text-anchor="middle" filter="url(#glow)">OLTO FRONTEND SUBSYSTEM</text>

  <!-- Subtitle -->
  <text x="600" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" text-anchor="middle">The Sovereign, Zero-Dependency Reactive Frontend Language &amp; AI-Native Runtime</text>
  <text x="600" y="176" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Zero HTML · Zero CSS · Zero JavaScript · Direct DOM Signal Patching (0.70 µs)</text>

  <!-- Grid of 3 Cards -->
  <!-- Card 1: Reactivity -->
  <g transform="translate(60, 215)">
    <rect width="330" height="235" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="330" height="4" rx="2" fill="#3b82f6" />
    <circle cx="44" cy="46" r="20" fill="#1e3a8a" />
    <text x="44" y="52" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="18" text-anchor="middle">⚡</text>
    <text x="76" y="44" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Signal Reactivity</text>
    <text x="76" y="62" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">0.70 µs DIRECT DOM PATCH</text>
    <text x="24" y="105" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13.5" line-height="1.5">
      <tspan x="24" dy="0">Bypasses Virtual DOM tree diffing</tspan>
      <tspan x="24" dy="20">entirely. Fine-grained Signals patch</tspan>
      <tspan x="24" dy="20">the live browser DOM directly with</tspan>
      <tspan x="24" dy="20">micro-second response latency.</tspan>
    </text>
    <rect x="24" y="188" width="130" height="26" rx="6" fill="#0f172a" stroke="#1e3a8a" />
    <text x="89" y="205" fill="#93c5fd" font-family="monospace" font-size="11" text-anchor="middle">No Virtual DOM</text>
  </g>

  <!-- Card 2: AI Native -->
  <g transform="translate(435, 215)">
    <rect width="330" height="235" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="330" height="4" rx="2" fill="#8b5cf6" />
    <circle cx="44" cy="46" r="20" fill="#4c1d95" />
    <text x="44" y="52" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="18" text-anchor="middle">🤖</text>
    <text x="76" y="44" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">AI-Native Synthesis</text>
    <text x="76" y="62" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">POWERED BY ECHO-1 AI</text>
    <text x="24" y="105" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13.5">
      <tspan x="24" dy="0">Prompt-to-App generation via CLI</tspan>
      <tspan x="24" dy="20">and VS Code panel. Self-healing</tspan>
      <tspan x="24" dy="20">compiler loop auto-repairs errors</tspan>
      <tspan x="24" dy="20">and blocks secret leaks (E9001).</tspan>
    </text>
    <rect x="24" y="188" width="155" height="26" rx="6" fill="#0f172a" stroke="#581c87" />
    <text x="101" y="205" fill="#d8b4fe" font-family="monospace" font-size="11" text-anchor="middle">one olto ai "prompt"</text>
  </g>

  <!-- Card 3: Zero-Dependency -->
  <g transform="translate(810, 215)">
    <rect width="330" height="235" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="330" height="4" rx="2" fill="#10b981" />
    <circle cx="44" cy="46" r="20" fill="#064e3b" />
    <text x="44" y="52" fill="#34d399" font-family="-apple-system, sans-serif" font-size="18" text-anchor="middle">📦</text>
    <text x="76" y="44" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Zero-Dep Bundler</text>
    <text x="76" y="62" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">STANDALONE WEB APPS</text>
    <text x="24" y="105" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13.5">
      <tspan x="24" dy="0">Compiles into 100% self-contained</tspan>
      <tspan x="24" dy="20">single-file HTML applications.</tspan>
      <tspan x="24" dy="20">Zero node_modules, zero external</tspan>
      <tspan x="24" dy="20">scripts. Runs on any browser.</tspan>
    </text>
    <rect x="24" y="188" width="145" height="26" rx="6" fill="#0f172a" stroke="#065f46" />
    <text x="96" y="205" fill="#6ee7b7" font-family="monospace" font-size="11" text-anchor="middle">one olto dev / build</text>
  </g>
</svg>
